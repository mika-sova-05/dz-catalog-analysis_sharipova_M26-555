
[project]
name = "catalog-analysis"
version = "0.1.0"
description = "Анализ каталога фильмов стримингового сервиса с использованием базовых структур данных и возможностей Python."
readme = "README.md"
authors = [
    { name = "Mika", email = "mika.sova.05@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
